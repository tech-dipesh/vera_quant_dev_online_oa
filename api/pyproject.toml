[project]
name = "quant-system-core"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "pandas-ta>=0.4.71b0",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "rq>=1.16",
    "python-dotenv>=1.0",
    "kiteconnect>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
